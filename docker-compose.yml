x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    container_name: briefrender-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
  redis:
    image: redis:7.2.0
    container_name: briefrender-redis
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: briefrender-api
    command: uvicorn briefrender.api:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DATA_DIR=/data
    volumes: [assets:/data]
    develop:
      watch:
      - action: sync
        paths: 
          - ./briefrender
          - ./assets
        target: /app
      - action: rebuild
        path: ./pyproject.toml
      - action: rebuild
        path: ./uv.lock
    logging: *default-logging
  
  worker:
    build: 
      context: .
      dockerfile: Dockerfile
    command: python -m briefrender.worker 
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
      - DATA_DIR=/data
    volumes: [assets:/data]
    deploy:
      replicas: 2
    develop:
      watch:
      - action: sync+restart
        paths: 
          - ./briefrender
          - ./assets
        target: /app
      - action: rebuild
        path: ./uv.lock
    logging: *default-logging

volumes:
  db-data:
  redis-data:
  assets:

[project]
name = "briefrender"
version = "0.1.0"
python = ">=3.13"
dependencies = [
    "pydantic",
    "fastapi",
    "uvicorn",
    "asyncpg",
    "anthropic",
    "python-pptx",
    "pillow",
    "nbformat",
    "redis"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "import-linter",
    "ruff",
    "ty"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
[tool.ruff.lint.isort]
known-first-party = ["briefrender"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "briefrender"

name: FAC-103 evaluation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview, authorize a paid submission, or collect a finished batch
        type: choice
        options: [preview, submit, collect]
        default: preview
      preview_run:
        description: Original preview run ID (submit and collect)
        type: string
      approved_sha256:
        description: Authorize one paid batch by entering the preview.json SHA-256 (submit only)
        type: string
      batch_id:
        description: Anthropic Message Batch ID (collect only)
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preview:
    if: inputs.operation == 'preview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Freeze the inputs for review
        run: |
          npm run --silent demo:batch-preview > preview.json
          sha256sum preview.json >> "$GITHUB_STEP_SUMMARY"
          jq '{trials:(.trials|length), model:.batch.requests[0].params.model, estimate}' preview.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fac-103-preview
          path: preview.json
          overwrite: false

  submit:
    if: inputs.operation == 'submit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      actions: read
      contents: write  # Create the one-use submission tag.
    steps:
      - name: Require Gabriel's manual dispatch
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$ACTOR" != "gketronDS" || "$TRIGGERING_ACTOR" != "gketronDS" ]]; then
            echo 'Paid submissions require dispatch by gketronDS.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Download reviewed preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
        run: bash .github/scripts/download-fac103-preview.sh
      - name: Verify approval and reserve one submission
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: bash .github/scripts/claim-fac103-preview.sh
      - name: Submit once and record batch ID
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: node apps/web/demo/submit-batch.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fac-103-submission
          path: receipt.json
          if-no-files-found: error

  collect:
    if: inputs.operation == 'collect' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Check the preview came from this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
        run: bash .github/scripts/download-fac103-preview.sh
      - name: Collect finished results
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: node apps/web/demo/scorecard.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fac-103-scorecard
          path: scorecard/
          if-no-files-found: error

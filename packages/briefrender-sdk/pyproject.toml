# /packages/loom-sdk/pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "briefrender-sdk"
version = "0.1.0"
description = "Python SDK for tracking agent telemetry and videos"
requires-python = ">=3.11"
dependencies = [
    "briefrender-core",     # Local workspace package
    "httpx>=0.24.0",        # For API requests
]

[tool.hatch.build.targets.wheel]
packages = ["src/briefrender"]
